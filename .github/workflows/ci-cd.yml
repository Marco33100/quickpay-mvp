name: QuickPay CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-node: '20'
        
    - name: Validate Backend (NestJS)
      run: |
        cd backend
        npm ci
        npm run lint
        
    - name: Validate Frontend (Vue.js)
      run: |
        cd frontend
        npm ci
        npm run lint